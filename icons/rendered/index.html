<!DOCTYPE html>
<html><head><style>
body { margin: 0; background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; gap: 40px; flex-wrap: wrap; padding: 40px; }
.card { text-align: center; }
.card p { color: #aaa; font-family: sans-serif; font-size: 13px; margin-top: 12px; }
.card img { border-radius: 22%; width: 256px; height: 256px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
</style></head><body>
<div class="card"><img src="icon_256.png"><p>256×256 (dock)</p></div>
<div class="card"><img src="icon_1024.png" style="width:512px;height:512px"><p>1024×1024 (full)</p></div>
<div class="card"><img src="icon_128x128.png"><p>128×128</p></div>
<div class="card"><img src="icon_64x64.png"><p>64×64</p></div>
<div class="card"><img src="icon_32x32.png"><p>32×32</p></div>
<div class="card"><img src="icon_16x16.png"><p>16×16</p></div>
</body></html>
