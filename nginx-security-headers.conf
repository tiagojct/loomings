# Strict CSP: the app never talks to a server. umami.tiagojct.eu is allowed
# for the landing page's analytics script (docs/index.html only — the editor
# never references it; this CSP is just a permission ceiling).
# nginx inherits add_header from the server only when the location defines no
# add_header of its own. Every such location must include this file too.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' https://umami.tiagojct.eu; connect-src 'self' https://umami.tiagojct.eu; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
