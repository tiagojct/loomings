<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loomings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="web-toolbar">
    <button id="tb-new" title="New">New</button>
    <button id="tb-open" title="Open">Open</button>
    <select id="tb-recent" title="Recent files" class="hidden"></select>
    <button id="tb-save" title="Save">Save</button>
    <div class="tb-menu-wrap">
      <button id="tb-export" title="Export" aria-haspopup="menu" aria-expanded="false">Export</button>
      <div id="export-menu" class="tb-menu hidden" role="menu" aria-label="Export">
        <button type="button" class="tb-menu-item" role="menuitem" data-action="html"><span class="tb-menu-label">HTML file</span></button>
        <button type="button" class="tb-menu-item" role="menuitem" data-action="print"><span class="tb-menu-label">Print / PDF…</span></button>
      </div>
    </div>
    <span class="tb-spacer"></span>
    <div class="tb-seg" role="group" aria-label="View">
      <button type="button" data-view="editor" aria-pressed="true" title="Editor only (Esc)">Write</button>
      <button type="button" data-view="split" aria-pressed="false" title="Editor and preview (⌘\)">Split</button>
      <button type="button" data-view="preview" aria-pressed="false" title="Preview only (⌘⇧P)">Preview</button>
    </div>
    <span class="tb-spacer"></span>
    <div class="tb-menu-wrap">
      <button id="tb-theme" title="Theme" aria-haspopup="menu" aria-expanded="false">Theme</button>
      <div id="theme-menu" class="tb-menu hidden" role="menu" aria-label="Theme">
        <div class="tb-menu-section">Family</div>
        <div id="theme-families"></div>
        <div class="tb-menu-section">Mode</div>
        <div id="theme-modes"></div>
      </div>
    </div>
    <button id="tb-about" title="About">About</button>
  </div>

  <div id="editor-container">
    <div id="content-area" class="width-normal">
      <div id="editor"></div>
      <div id="preview" class="hidden"></div>
    </div>
  </div>

  <div id="statusbar">
    <div id="status-left">
      <span id="status-app">Loomings</span>
      <span id="status-file" class="hidden"></span>
      <span id="dirty" class="hidden">&bull;</span>
    </div>
    <div id="status-right">
      <span id="cursor-pos">Ln 1, Col 1</span>
      <div id="stats">
        <span id="stat-words">0 w</span>
        <span id="stat-chars">0 c</span>
        <span id="stat-lines">0 ln</span>
        <span id="stat-read"></span>
      </div>
    </div>
  </div>

  <div id="palette" class="hidden">
    <div id="palette-inner">
      <input id="palette-input" type="text" placeholder="Jump to heading…" autocomplete="off" spellcheck="false"/>
      <ul id="palette-list"></ul>
    </div>
  </div>

  <div id="about" class="hidden">
    <div id="about-inner">
      <img id="about-icon" src="" alt="Loomings" width="96" height="96">
      <h2>Loomings</h2>
      <p id="about-version">Version</p>
      <p class="about-tagline">A markdown writing app. The shapes loom before they take form.</p>
      <p class="about-tech" id="about-tech">MIT licensed. Built with CodeMirror 6.</p>
      <div class="about-links">
        <a href="#" data-url="https://loomings.tiagojct.eu">loomings.tiagojct.eu</a>
        <a href="#" data-url="https://github.com/tiagojct/loomings">github.com/tiagojct/loomings</a>
        <a href="#" id="about-example">Open Moby-Dick chapter</a>
      </div>
      <p class="about-credit">© 2026 Tiago Jacinto</p>
    </div>
  </div>

  <script type="module" src="editor.js"></script>
</body>
</html>
