server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No Tauri runtime here, so this is stricter than the desktop app's CSP
    # (tauri.conf.json) — no tauri:/ipc:/asset: schemes, no update-check
    # host, since the web build's ipcCheckForUpdate is a no-op. umami.tiagojct.eu
    # is allowed for the landing page's analytics script (docs/index.html only —
    # the editor app never references it, CSP here is just a permission ceiling).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' https://umami.tiagojct.eu; connect-src 'self' https://umami.tiagojct.eu; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Editor app at /app — built with --base /app/ (see Dockerfile) so its
    # own asset references resolve under this prefix. Landing page (docs/)
    # owns the root.
    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
    }

    # Content-hashed build assets — safe to cache forever.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
