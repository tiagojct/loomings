server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strict CSP: the app never talks to a server. umami.tiagojct.eu is
    # allowed for the landing page's analytics script (docs/index.html only —
    # the editor never references it, CSP here is just a permission ceiling).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' https://umami.tiagojct.eu; connect-src 'self' https://umami.tiagojct.eu; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    # Any other redirect nginx generates should also keep the scheme the
    # visitor used; the proxy in front terminates TLS.
    absolute_redirect off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Editor app at /app — built with base /app/ (vite.config.js) so its
    # own asset references resolve under this prefix. Landing page (docs/)
    # owns the root.
    # nginx sits behind Cloudflare and Caddy and only ever sees plain HTTP,
    # so its automatic "add a trailing slash" redirect pointed at http://.
    # A relative Location (absolute_redirect off, above) keeps whatever
    # scheme the visitor used.
    location = /app {
        return 301 /app/;
    }
    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
    }

    # Content-hashed build assets — safe to cache forever. (sw.js matches too,
    # but browsers always refetch a registered service worker script from
    # the network, so the long max-age does not delay updates.)
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker is fetched by a versioned URL (browser.js), but keep
    # the file itself out of the long-lived cache so the CDN never pins it.
    location = /app/sw.js {
        expires -1;
    }

    # nginx's mime.types has no entry for .webmanifest; without this the
    # PWA manifest goes out as application/octet-stream.
    location ~* \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        expires 1d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
